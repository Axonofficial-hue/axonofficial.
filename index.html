<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AXON Free Fire Tournaments</title>
<meta name="theme-color" content="#0a0612">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0a0612;--card:#150d24;--line:#3b2466;--purple:#8b3dff;--gold:#f5c542;--text:#fff;--mut:#a99bc4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif}
body{max-width:480px;margin:0 auto;padding-bottom:84px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{height:64px;display:flex;align-items:center}
.logo img{height:64px;width:auto}
.logo b{font-size:36px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.right{display:flex;align-items:center;gap:8px}
.hic{width:20px;height:20px}.ic{width:26px;height:26px}.tg{width:38px;height:38px;opacity:.55}
.help{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--purple);background:#1d1133;color:var(--gold);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.lang{height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:#fff;font-size:13px;font-weight:700}
.ticker{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);background:#120a21;padding:9px 0}
.ticker span{display:inline-block;padding-left:100%;color:var(--gold);font-weight:700;font-size:14px;animation:mv 18s linear infinite}
@keyframes mv{to{transform:translateX(-100%)}}
.slider{margin:16px;border-radius:18px;overflow:hidden;border:1px solid var(--purple);position:relative}
.track{display:flex;transition:transform .7s ease}
.slide{cursor:pointer;min-width:100%;aspect-ratio:16/8;position:relative;background:linear-gradient(135deg,#1b0b3a,var(--purple));display:grid;place-items:center}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide em{font-style:normal;font-weight:900;font-size:22px;color:#fff;opacity:.85}
.dots{position:absolute;bottom:8px;right:12px;display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:4px;background:#ffffff66;transition:.3s}
.dots i.on{width:22px;background:var(--gold)}
h2{font-size:22px;font-weight:900;padding:6px 16px 4px}
h2+p{color:var(--mut);font-size:14px;padding:0 16px 12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:center}
.mode .art{height:84px;display:grid;place-items:center;font-size:34px;position:relative;overflow:hidden}
.mode .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mode .nm{padding:10px 6px;font-weight:900;font-size:14px;border-top:2px solid var(--gold);letter-spacing:.4px}
.mode:active{transform:scale(.97)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 8px}
.soc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.soc svg{width:28px;height:28px;flex:none}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#0f0819;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav a{flex:1;text-align:center;color:var(--mut);font-size:12px;font-weight:700}
nav a div{height:28px;display:grid;place-items:center}
nav a.on{color:var(--gold)}

.sub{padding:0 16px 20px}
.sh{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.sh h3{font-size:18px;font-weight:900}
.bk{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;display:grid;place-items:center}
.si{width:18px;height:18px;flex:none;color:var(--gold)}
.bk .si{color:#fff}
.tabs{display:flex;gap:8px;padding:14px 16px 4px}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;font-size:14px}
.tab.on{background:var(--purple);border-color:var(--purple);color:#fff}
.tc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px}
.poster{aspect-ratio:16/8;position:relative;display:grid;place-items:center;overflow:hidden}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .tag{position:absolute;left:10px;top:10px;background:#000a;border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.tb{padding:12px 14px}
.tb h4{font-size:17px;font-weight:900;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:#e8defa;margin:6px 0}
.row b{color:#fff}
.bar{height:6px;border-radius:3px;background:#2a1b45;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--gold))}
.btns{display:flex;gap:10px;padding:0 14px 14px}
.btn{flex:1;padding:12px;border-radius:12px;font-weight:900;font-size:14px;border:1px solid var(--purple);background:transparent;color:#fff}
.btn.p{background:linear-gradient(90deg,var(--purple),#5b1fd0);border-color:var(--purple)}
.btn[disabled]{opacity:.55}
.empty{text-align:center;color:var(--mut);padding:50px 10px;font-size:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.box h5{font-size:15px;font-weight:900;color:var(--gold);margin-bottom:8px}
.box li{margin:6px 0 6px 18px;font-size:14px;color:#e8defa}
.pz{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:#140a26;border-top:2px solid var(--gold);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h4{font-size:18px;margin-bottom:12px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.sheet input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a0612;color:#fff;font-size:15px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#000;font-weight:700;padding:10px 16px;border-radius:20px;z-index:30;font-size:14px}
.mi{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-top:12px;width:100%;color:#fff;font-weight:700;font-size:16px;text-align:left}
.mi .si{width:24px;height:24px}.mi span{flex:1}.mi .chev{width:18px;height:18px;color:var(--mut)}
.pc{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;border-radius:16px;border:1px solid var(--purple);background:linear-gradient(135deg,#1d1133,#150d24)}
.av{width:60px;height:60px;border-radius:50%;border:2px solid var(--gold);background:#2a1b45;display:grid;place-items:center;flex:none}
.av .si{width:30px;height:30px}
.pi{flex:1;min-width:0}.pi b{display:block;font-size:18px}.pi small{color:var(--mut);font-size:13px}
.ed{height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.ed .si{width:16px;height:16px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.st b{display:block;font-size:20px;color:var(--gold)}.st small{font-size:12px;color:var(--mut)}
.mi em{font-style:normal;color:var(--gold);font-size:14px}
.ver{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
.auth{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ab{max-width:480px;margin:0 auto;padding:18px 20px 30px}
.ab .lg{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.ab .lg img{height:72px;width:auto}
.ab .lg b{font-size:40px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.ab h2{padding:0;font-size:26px}.ab p{color:var(--mut);font-size:14px;margin:4px 0 18px}
.ab label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.ab input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:16px}
.ab input:focus{outline:none;border-color:var(--purple)}
.er{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:18px}
.ab .btn{width:100%;margin-top:14px;padding:15px;font-size:16px}
.ab .tabs{padding:0 0 6px}
.toast{z-index:60!important}
.stt{margin:0 14px 12px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4}
.stt.ok{background:#12301f;border:1px solid #2f7a4f;color:#9be7b8}
.stt.rm{background:#351616;border:1px solid #8a3030;color:#ffb3b3}
.sheet{max-height:92vh;overflow:auto}
.pay{background:#0a0612;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px;font-size:14px}
.pay .amt{font-size:22px;font-weight:900;color:var(--gold)}
.qr{width:164px;height:164px;margin:10px auto;border-radius:12px;background:#fff;display:grid;place-items:center;color:#000;font-size:12px}
.qr img,.qr canvas{width:140px;height:140px}
.wn{background:#2b2108;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px;line-height:1.4}
.upl{display:block;margin-top:4px;padding:12px;border:1px dashed var(--gold);border-radius:10px;color:var(--gold);text-align:center;font-weight:700;font-size:14px}
.sm{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.4}
.upw{position:relative;margin-top:4px}
.upw .upl{margin:0}
.sheet .upw input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer;font-size:0}

.bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#1d1133;color:#fff;display:grid;place-items:center}
.bell .si{color:#fff;width:20px;height:20px}
.dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:#ff4d4d;border:2px solid #1d1133}
.dot[hidden]{display:none}
.nt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.45}
.nt.un{border-color:var(--gold)}
.stt.wt{background:#1a1230;border:1px solid var(--line);color:var(--mut)}
.room{margin:0 14px 12px;padding:12px;border:1px solid var(--gold);border-radius:12px;background:#1f1605}
.room h6{font-size:13px;color:var(--gold);margin-bottom:6px}
.room .pz{align-items:center}
.room .pz b{font-size:16px;letter-spacing:.5px}

.poster{aspect-ratio:auto;min-height:110px}
.poster img{position:static;display:block;width:100%;height:auto}
.poster .tg{position:absolute}

.fh{display:flex;align-items:center;gap:12px;padding:28px 16px 6px}
.fh i{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.fh i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.fh h2{padding:0;font-size:24px;font-weight:900;text-transform:uppercase;white-space:nowrap;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang=en] .fh h2{letter-spacing:2px}
.fsub{color:var(--mut);font-size:14px;text-align:center;padding:2px 16px 14px}

.ab p{padding:0}
.right{flex-shrink:0}
.logo{min-width:0}.logo img{max-width:100%;object-fit:contain}
</style>
</head>

</nav>

 }else{

  else{h=head(l.pr)+'<div class="sub">'+
   '<div class="pc"><div class="av">'+ic("user")+'</div><div class="pi"><b>'+(prof.n||l.pdef)+'</b><small>'+(prof.id?"Free Fire ID: "+prof.id:l.nid)+'</small></div><button class="ed" data-ed="1">'+ic("edit")+l.edit+'</button></div>'+
   '<div class="st"><div><b>0</b><small>'+l.pl+'</small></div><div><b>0</b><small>'+l.wn+'</small></div><div><b>₹0</b><small>'+l.pw+'</small></div></div>'+
   '<button class="mi" data-lg="1">'+ic("globe")+'<span>'+l.lg+'</span><em>'+l.lgv+'</em>'+ic("chev","chev")+'</button>'+
   '<button class="mi" data-sh="1">'+ic("share")+'<span>'+l.inv+'</span>'+ic("chev","chev")+'</button>'+
   menu.map(function(x){return '<button class="mi" '+(x[0]==="lo"?'data-lo="1"':'data-i="'+x[0]+'"')+'>'+ic(x[1])+'<span>'+l[x[0]]+'</span>'+ic("chev","chev")+'</button>'}).join("")+'<p class="ver">'+l.ver+'</p></div>'}
 }
 sv.innerHTML=h;
}
function toast(x){var e=document.createElement("div");e.className="toast";e.textContent=x;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
var user=null,authIn=false,am="login",er="",fv={};
try{user=JSON.parse(localStorage.getItem("axon_user"))}catch(e){}
try{authIn=localStorage.getItem("axon_in")==="1"&&!!user}catch(e){}
var au=document.getElementById("auth");
function readF(){["a1","a2","a3","a4"].forEach(function(k){var e=document.getElementById(k);if(e)fv[k]=e.value})}
function logoImg(){return '<img src="'+encodeURI(IMG+"Logo.png")+'" alt="AXON" onerror="this.outerHTML=\'<b>AXON</b>\'">'}
function auth(){
 au.hidden=authIn;
 if(authIn){return}
 var l=L(),su=am==="signup";
 var f=su?'<label>'+l.nm+'</label><input id="a1" autocomplete="name"><label>'+l.fPh+'</label><input id="a2" inputmode="numeric" maxlength="10" autocomplete="tel"><label>'+l.fEm+'</label><input id="a3" type="email" autocomplete="email"><label>'+l.fPw2+'</label><input id="a4" type="password" autocomplete="new-password">'
  :'<label>'+l.fId+'</label><input id="a2" autocomplete="username"><label>'+l.fPw+'</label><input id="a4" type="password" autocomplete="current-password">';
 au.innerHTML='<div class="ab"><div class="lg">'+logoImg()+'<button class="lang" data-al="1">'+l.btn+'</button></div><h2>'+(su?l.suT:l.liT)+'</h2><p>'+(su?l.suS:l.liS)+'</p>'+
  '<div class="tabs"><button class="tab'+(su?'':' on')+'" data-am="login">'+l.tLi+'</button><button class="tab'+(su?' on':'')+'" data-am="signup">'+l.tSu+'</button></div>'+f+
  '<div class="er">'+er+'</div><button class="btn p" data-go="1">'+(su?l.tSu:l.tLi)+'</button></div>';
 ["a1","a2","a3","a4"].forEach(function(k){var e=document.getElementById(k);if(e&&fv[k])e.value=fv[k]});
}
function doAuth(){
 readF();var l=L(),v=function(k){return(fv[k]||"").trim()};
 if(am==="signup"){
  if(!v("a1"))return er=l.eN,auth();
  if(!/^[6-9]\d{9}$/.test(v("a2")))return er=l.eP,auth();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("a3")))return er=l.eE,auth();
  if((fv.a4||"").length<6)return er=l.eW,auth();
  user={n:v("a1"),ph:v("a2"),em:v("a3").toLowerCase(),pw:fv.a4};
  prof.n=user.n;saveProf();
  try{localStorage.setItem("axon_user",JSON.stringify(user))}catch(e){}
  toast(l.suOk);
 }else{
  if(!user)return er=l.eX,auth();
  var id=v("a2").toLowerCase();
  if((id!==user.ph&&id!==user.em)||fv.a4!==user.pw)return er=l.eL,auth();
  if(!prof.n){prof.n=user.n;saveProf()}
 }
 authIn=true;er="";fv={};view="home";
 try{localStorage.setItem("axon_in","1")}catch(e){}
 auth();render();scrollTo(0,0);
}
function logout(){
 var l=L(),o=document.createElement("div");o.className="ov";
 o.innerHTML='<div class="sheet"><h4>'+l.loQ+'</h4><div class="btns" style="padding:8px 0 0"><button class="btn" id="c1">'+l.cancel+'</button><button class="btn p" id="c2">'+l.lo+'</button></div></div>';
 document.body.appendChild(o);
 document.getElementById("c1").onclick=function(){o.remove()};
 document.getElementById("c2").onclick=function(){o.remove();authIn=false;am="login";er="";fv={};try{localStorage.setItem("axon_in","0")}catch(e){}view="home";render();auth();toast(l.loOk)};
}
function editp(){
 var l=L(),o=document.createElement("div");o.className="ov";
 o.innerHTML='<div class="sheet"><h4>'+l.ep+'</h4><label>'+l.nm+'</label><input id="e1"><label>'+l.ffid+'</label><input inputmode="numeric" id="e2"><div class="btns" style="padding:16px 0 0"><button class="btn" id="c1">'+l.cancel+'</button><button class="btn p" id="c2">'+l.save+'</button></div></div>';
 document.body.appendChild(o);

}

function sheet(id){
 var l=L(),t=find(id),o=document.createElement("div");o.className="ov";
 var upl="upi://pay?pa="+UPI+"&pn="+encodeURIComponent(PAYEE)+"&am="+t.fee+".00&cu=INR&tn="+encodeURIComponent("AXON "+title(t));
 var pay=t.fee?'<label>'+l.pay+'</label><div class="pay"><div>'+l.amt+'</div><div class="amt">₹'+t.fee+'</div><div class="qr" id="qr">QR</div><div style="font-size:13px;color:var(--mut);text-align:center">'+l.scan+'</div><div class="wn">'+l.ex+'</div><div class="pz" style="margin-top:10px"><span>'+l.upiI+': <b>'+UPI+'</b></span><button class="ed" id="cp" style="height:32px">'+l.cp+'</button></div><a class="btn p" id="up" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="'+upl+'">'+l.payU+'</a></div>'+
  '<label>'+l.shot+'</label><div class="upw"><div class="upl" id="ul">'+l.shotU+'</div><input type="file" accept="image/*" id="fl"></div><label>'+l.utr+'</label><input id="f3"><div class="sm">'+l.note+'</div>':'';
 o.innerHTML='<div class="sheet"><h4>'+title(t)+'</h4><label>'+l.ffid+'</label><input inputmode="numeric" id="f1"><label>'+l.ign+'</label><input id="f2">'+pay+'<div class="er" id="fe"></div><div class="btns" style="padding:8px 0 0"><button class="btn" id="c1">'+l.cancel+'</button><button class="btn p" id="c2">'+(t.fee?l.sub:l.confirm)+'</button></div></div>';
 document.body.appendChild(o);
 var q=function(i){return document.getElementById(i)},fn="";
 q("f1").value=prof.id;q("f2").value=prof.n;
 q("c1").onclick=function(){o.remove()};
 if(t.fee){
  try{q("qr").textContent="";new QRCode(q("qr"),{text:upl,width:140,height:140,correctLevel:QRCode.CorrectLevel.M})}catch(e){q("qr").textContent="QR"}
  q("cp").onclick=function(){try{navigator.clipboard.writeText(UPI);toast(l.cpd)}catch(e){}};
  q("fl").onchange=function(){if(this.files[0]){fn=this.files[0].name;q("ul").textContent=fn}};
 }
 q("c2").onclick=function(){
  if(!q("f1").value.trim()||!q("f2").value.trim())return;
  if(t.fee&&!fn){q("fe").textContent=l.needS;return}
  prof.id=q("f1").value.trim();prof.n=q("f2").value.trim();saveProf();
  joined[id]={s:"ok",f:fn};addNote("join",id);t.filled++;o.remove();render();toast(l.jOk);
 };
}
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-j],[data-d],[data-b],[data-tab],[data-i],[data-lo],[data-ed],[data-lg],[data-sh],[data-am],[data-go],[data-al],[data-demo],[data-demo2],[data-mtab],[data-cp],nav a");
 if(!el)return;
 if(el.hasAttribute("data-j")){sheet(el.getAttribute("data-j"))}
 else if(el.hasAttribute("data-i")){info=el.getAttribute("data-i");view="info";render();scrollTo(0,0)}
 else if(el.hasAttribute("data-demo")){var k=Object.keys(joined).filter(function(x){return joined[x].s==="ok"})[0];if(k){joined[k].s="rm";find(k).filled--;addNote("rm",k);render()}}
 else if(el.hasAttribute("data-demo2")){var k2=Object.keys(joined).filter(function(x){return joined[x].s==="ok"&&!find(x).room})[0];if(k2){find(k2).room={id:"5839 2041",pw:"AXON"+Math.floor(100+Math.random()*900)};addNote("room",k2);render()}}
 else if(el.hasAttribute("data-mtab")){mtab=el.getAttribute("data-mtab");render()}
 else if(el.hasAttribute("data-cp")){var cv=el.getAttribute("data-cp");try{navigator.clipboard.writeText(cv);toast(L().cpyd)}catch(e){}}
 else if(el.hasAttribute("data-am")){readF();am=el.getAttribute("data-am");er="";auth()}
 else if(el.hasAttribute("data-go")){doAuth()}
 else if(el.hasAttribute("data-al")){toggleLang()}
 else if(el.hasAttribute("data-lo")){logout()}
 else if(el.hasAttribute("data-ed")){editp()}
 else if(el.hasAttribute("data-lg")){toggleLang()}
 else if(el.hasAttribute("data-sh")){share()}
 else if(el.hasAttribute("data-d")){tid=el.getAttribute("data-d");view="detail";render();scrollTo(0,0)}
 else if(el.hasAttribute("data-b")){view=el.getAttribute("data-b");render();scrollTo(0,0)}
 else if(el.hasAttribute("data-tab")){tab=el.getAttribute("data-tab");render()}
 else{view=el.getAttribute("data-v");render();scrollTo(0,0)}
});
